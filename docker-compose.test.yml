# docker-compose.test.yml
services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: moneytrack_test
    ports:
      - "5433:5432" 
    tmpfs:
      - /var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d moneytrack_test"]
      interval: 2s
      timeout: 3s
      retries: 15